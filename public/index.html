<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Role-based quiz learning platform with courses, quizzes, gradebook, and secure accounts.">
  <title>Quiz LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <nav class="navbar" id="navbar">
    <a href="#/" class="nav-brand" aria-label="Quiz LMS home">
      <span class="brand-mark">QL</span>
      <span class="brand-text">Quiz LMS</span>
    </a>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-user" id="nav-user"></div>
  </nav>

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Modal</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/js/app.js"></script>

</html>
