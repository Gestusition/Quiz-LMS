<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz Manager — Manage categories, create questions, and take quizzes with a modern web interface.">
  <title>Quiz Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-text">Quiz Manager</span>
    </div>
    <ul class="nav-links">
      <li><a href="#/" class="nav-link active" data-route="/" id="nav-dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </a></li>
      <li><a href="#/categories" class="nav-link" data-route="/categories" id="nav-categories">
        <span class="nav-icon">📁</span> Categories
      </a></li>
      <li><a href="#/questions" class="nav-link" data-route="/questions" id="nav-questions">
        <span class="nav-icon">❓</span> Questions
      </a></li>
      <li><a href="#/quiz" class="nav-link" data-route="/quiz" id="nav-quiz">
        <span class="nav-icon">🎮</span> Quiz
      </a></li>
      <li><a href="/api-docs" class="nav-link nav-link-external" target="_blank" id="nav-swagger">
        <span class="nav-icon">📄</span> API Docs
      </a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="app">
    <!-- Content loaded dynamically by router -->
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Modal</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/categories.js"></script>
  <script src="/js/questions.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
